name: Continuous Delivery

# Versions the repository with Release Please (stable releases) and semantic-release
# (dev prereleases on main), then builds and publishes the image
# io2060/avatar-issuer-chatbot and the Helm chart io2060/hologram-avatar-issuer-vs-chart,
# both at the release version. The demo is deployed from 2060-io/hologram-demos-deploy,
# which pins the published chart.
#
# Tags: stable releases get vX.Y.Z, vX.Y and vX; dev prereleases get vX.Y.Z-dev.N plus
# vX.Y.Z-dev, vX.Y-dev, vX-dev and dev.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioning:
    name: Resolve version
    permissions:
      contents: write
      pull-requests: write
    uses: 2060-io/organization/.github/workflows/resolve-version-call.yml@92e4863951451e6e1eed78d73fce791e5d0458d1 # main
    secrets: inherit

  avatar-issuer-chatbot:
    name: Build and push avatar-issuer-chatbot
    needs: versioning
    if: needs.versioning.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: io2060/avatar-issuer-chatbot
      RELEASE_VERSION: ${{ needs.versioning.outputs.release-version }}
      RELEASE_TYPE: ${{ needs.versioning.outputs.release-type }}
      RELEASE_MAJOR: ${{ needs.versioning.outputs.release-major }}
      RELEASE_MINOR: ${{ needs.versioning.outputs.release-minor }}
      RELEASE_PATCH: ${{ needs.versioning.outputs.release-patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve image tags
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [ "$RELEASE_TYPE" = "stable" ]; then SUFFIX=""; else SUFFIX="-dev"; fi
          {
            echo "TAGS<<EOF"
            echo "$IMAGE:v$VERSION"
            echo "$IMAGE:v${RELEASE_MAJOR}${SUFFIX}"
            echo "$IMAGE:v${RELEASE_MAJOR}.${RELEASE_MINOR}${SUFFIX}"
            echo "$IMAGE:v${RELEASE_MAJOR}.${RELEASE_MINOR}.${RELEASE_PATCH}${SUFFIX}"
            if [ "$RELEASE_TYPE" != "stable" ]; then echo "$IMAGE:dev"; fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        env:
          DH_USERNAME: ${{ secrets.DOCKER_HUB_LOGIN }}
          DH_TOKEN: ${{ secrets.DOCKER_HUB_PWD }}
        run: echo "$DH_TOKEN" | docker login -u "$DH_USERNAME" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          FIRST=$(echo "$TAGS" | head -1)
          docker build -t "$FIRST" .
          for tag in $TAGS; do
            [ "$tag" = "$FIRST" ] || docker tag "$FIRST" "$tag"
            docker push "$tag"
          done
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          for tag in $TAGS; do echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Set up Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3.5

      # The chart has the version of the release, and its default image tag is that version.
      - name: Package and push the Helm chart
        env:
          DH_USERNAME: ${{ secrets.DOCKER_HUB_LOGIN }}
          DH_TOKEN: ${{ secrets.DOCKER_HUB_PWD }}
        run: |
          set -euo pipefail
          VERSION="v${RELEASE_VERSION#v}"
          echo "$DH_TOKEN" | helm registry login -u "$DH_USERNAME" --password-stdin registry-1.docker.io
          sed -i "s/^version:.*/version: $VERSION/; s/^appVersion:.*/appVersion: \"${VERSION#v}\"/" charts/Chart.yaml
          CHART_NAME=$(awk '/^name:/ {print $2}' charts/Chart.yaml)
          helm dependency update charts
          helm package charts -d dist-chart
          helm push "dist-chart/$CHART_NAME-$VERSION.tgz" oci://registry-1.docker.io/io2060
          echo "- chart \`oci://registry-1.docker.io/io2060/$CHART_NAME:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
