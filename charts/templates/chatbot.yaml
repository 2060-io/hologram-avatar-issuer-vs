# Service of the avatar issuer chatbot: the VS Agent posts its events to
# http://<name>:<chatbot.port>/events. The chatbot has no public route.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.chatbot.port }}
      targetPort: {{ .Values.chatbot.port }}
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  serviceName: {{ .Values.name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: chatbot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CHATBOT_PORT
              value: {{ .Values.chatbot.port | quote }}
            - name: VS_AGENT_ADMIN_URL
              value: {{ tpl .Values.chatbot.vsAgentAdminUrl . | quote }}
            - name: JSON_SCHEMA_CREDENTIAL_ID
              value: {{ required "chatbot.jsonSchemaCredentialId is required" (tpl .Values.chatbot.jsonSchemaCredentialId .) | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.chatbot.serviceName | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.chatbot.logLevel | quote }}
            - name: DATABASE_URL
              value: {{ .Values.chatbot.databaseUrl | quote }}
            - name: MINIO_ENDPOINT
              value: {{ required "chatbot.objectStore.endpoint is required" .Values.chatbot.objectStore.endpoint | quote }}
            - name: MINIO_PORT
              value: {{ .Values.chatbot.objectStore.port | quote }}
            - name: MINIO_USE_SSL
              value: {{ .Values.chatbot.objectStore.useSSL | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.chatbot.objectStore.bucket | quote }}
            - name: MINIO_PUBLIC_URL
              value: {{ required "chatbot.objectStore.publicUrl is required" (tpl .Values.chatbot.objectStore.publicUrl .) | quote }}
            {{- with .Values.chatbot.objectStore }}
            {{- if .existingSecret }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .accessKeyKey }}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .secretKeyKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.chatbot.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.chatbot.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          resources:
            {{- toYaml .Values.chatbot.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.chatbot.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.chatbot.storage.size }}
